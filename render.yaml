services:
  - type: web
    name: assistentesportiu
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run build --workspace @assistent-esportiu/api
    startCommand: npm run start --workspace @assistent-esportiu/api
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-5-mini
      - key: WEB_ORIGIN
        value: https://ssistentesportiu-app.onrender.com
  - type: web
    name: ssistentesportiu-app
    runtime: static
    buildCommand: npm ci && npm run build --workspace @assistent-esportiu/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://assistentesportiu.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
